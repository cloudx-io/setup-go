name: 'Trim GOCACHE to working set'
description: 'Post-job hook: drop GOCACHE entries not used by this run before actions/cache saves.'
inputs:
  gocache:
    description: 'GOCACHE directory to trim.'
    required: true
  max-staleness-hours:
    description: 'Whole hours to retain entries before the job start time.'
    required: false
    default: '2'
runs:
  using: 'node24'
  main: 'main.js'
  post: 'trim.js'
